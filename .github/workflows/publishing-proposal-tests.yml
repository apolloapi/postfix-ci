name: Publishing proposal tests
on:
  pull_request:
    paths:
      - 'scripts/prepare-postfix-*.py'
      - 'tests/test_publishing_proposal.py'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: python3 -m unittest discover -s tests -p 'test_publishing_proposal.py'
