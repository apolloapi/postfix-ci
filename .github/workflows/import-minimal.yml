name: Propose Minimal recipe import
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  propose:
    if: github.repository == 'apolloapi/postfix-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Import pinned MIT source and prepare Apollo workflows
        env:
          UPSTREAM_COMMIT: ${{ vars.MINIMAL_IMPORT_COMMIT }}
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Set MINIMAL_IMPORT_COMMIT to the reviewed upstream commit SHA'; exit 1; }
          test ! -e catalog-recipes || { echo 'Recipes already imported; upstream updates require a separate reviewed PR'; exit 1; }
          curl --fail --location --retry 3 "https://github.com/rtvkiz/minimal/archive/${UPSTREAM_COMMIT}.tar.gz" -o /tmp/minimal.tar.gz
          mkdir /tmp/minimal-source
          tar xzf /tmp/minimal.tar.gz -C /tmp/minimal-source --strip-components=1
          test -f /tmp/minimal-source/LICENSE
          mv /tmp/minimal-source catalog-recipes
          mv catalog-recipes/.github catalog-recipes/upstream-github-workflows
          printf '%s\n' "$UPSTREAM_COMMIT" > catalog-recipes/UPSTREAM_COMMIT
          python3 -m pip install 'PyYAML==6.0.3'
          python3 scripts/prepare-postfix-builds.py
      - name: Open import PR; never merge
        env:
          GH_TOKEN: ${{ secrets.POSTFIX_PR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'POSTFIX_PR_TOKEN requires Contents, Pull requests and Workflows write access to this repository'; exit 1; }
          BRANCH="postfix/import-minimal-${GITHUB_RUN_ID}"
          git config user.name 'Postfix CI'
          git config user.email 'ci@users.noreply.github.com'
          git add catalog-recipes postfix-catalog.json .github/workflows/build.yml .github/workflows/melange-images.yml
          git commit -m 'Vendor MIT Minimal recipes and prepare Apollo-owned builds'
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$GITHUB_SHA"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" --title 'Import Minimal recipes and Apollo build workflows' --body 'MIT source preserved. Apollo image names, source annotations, signatures, SBOMs and provenance. Publishing remains disabled until the owner enables POSTFIX_PUBLISH_ENABLED. No deployment, automated merge, schedules or package deletion.'